<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Query Handler</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">

        <h1>Real-Time Multilingual Query Handler</h1>

        <textarea id="queryInput"
        placeholder="Enter your query in any language"></textarea>

        <button onclick="translateQuery()">
            Translate
        </button>

        <div class="result-box">

            <h3>Detected Language</h3>
            <p id="language"></p>

            <h3>Translated Text</h3>
            <p id="translated"></p>

            <h3>Support Response</h3>
            <p id="response"></p>

        </div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
